name: Build Agent MSI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string'
        required: true
        default: 'dev'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r collector/requirements.txt pyinstaller pywin32 pystray Pillow windows-toasts

      - name: Build detec-agent.exe
        run: pyinstaller installers/windows/detec-agent.spec --distpath installers/windows/dist --workpath installers/windows/build -y

      - name: Build detec-agent-gui.exe
        run: pyinstaller installers/windows/detec-agent-gui.spec --distpath installers/windows/dist --workpath installers/windows/build -y

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Build MSI
        working-directory: installers/windows
        run: wix build DetecAgent.wxs -o dist/DetecAgent.msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: DetecAgent-${{ github.ref_name || inputs.version || 'dev' }}
          path: installers/windows/dist/DetecAgent.msi

      - name: Upload to Detec server
        if: ${{ secrets.DETEC_SERVER_URL != '' }}
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_name }}") { "${{ github.ref_name }}" } else { "${{ inputs.version }}" }
          curl.exe -X POST "${{ secrets.DETEC_SERVER_URL }}/api/agent-builds" `
            -H "X-Api-Key: ${{ secrets.DETEC_ADMIN_API_KEY }}" `
            -F "file=@installers\windows\dist\DetecAgent.msi" `
            -F "version=$version"
