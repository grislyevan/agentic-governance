name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install and build
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: dashboard-dist
          path: dashboard/dist

  build-docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build-dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Download dashboard artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-dist
          path: dashboard/dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Build and push detec-api
        uses: docker/build-push-action@471d1dc4e1532c2e25b1441168cc0b4199577741 # v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/detec-api:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/detec-api:latest
      - name: Build and push detec-dashboard
        uses: docker/build-push-action@471d1dc4e1532c2e25b1441168cc0b4199577741 # v6
        with:
          context: .
          file: dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/detec-dashboard:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/detec-dashboard:latest

  build-windows-agent:
    name: Build Windows Agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install collector and build deps
        run: |
          pip install -e .
          pip install pyinstaller pywin32
      - name: Run PyInstaller
        working-directory: installers/windows
        run: pyinstaller --clean --noconfirm detec-agent.spec
      - name: Create zip archive
        run: |
          Compress-Archive -Path "installers\windows\dist\detec-agent\*" -DestinationPath "detec-agent-windows.zip"
      - name: Upload Windows agent
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: windows-agent
          path: detec-agent-windows.zip

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - build-dashboard
      - build-docker
      - build-windows-agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Download Windows agent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-agent
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          generate_release_notes: true
          files: |
            windows-agent/detec-agent-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
