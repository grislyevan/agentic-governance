name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: agentic_governance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"
          cache: pip
      # pytest lives in .[dev]; api/requirements.txt does not include it (matches ci.yml).
      - name: Install project and test tooling
        run: pip install -e ".[dev]"
      - name: Install API dependencies
        run: pip install -r api/requirements.txt
      - name: Run API security tests
        working-directory: api
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/agentic_governance_test
          JWT_SECRET: ci-test-secret-not-for-production
          SEED_ADMIN_PASSWORD: ci-test-password
        run: >-
          python -m pytest
          tests/test_security_pentest.py
          tests/test_gateway_security.py
          tests/test_rate_limits.py
          -x -q
      - name: Run collector security tests
        run: python -m pytest collector/tests/test_agent_security.py -x -q

  sast:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/owasp-top-ten
            p/cwe-top-25
            p/python
            p/javascript

  dependency-scan:
    name: Dependency Audit (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Scan for vulnerable dependencies
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.35.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"

  dependency-audit:
    name: Dependency Audit (pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pip-audit and Python dependencies
        run: |
          pip install pip-audit
          pip install -e .
          pip install -r api/requirements.txt
      - name: Audit Python dependencies (collector + API)
        # CVE-2026-4539: pygments 2.19.2 — transitive dep (not ours); no fix
        # version available yet. Re-evaluate when pygments releases a patch.
        run: pip-audit --ignore-vuln CVE-2026-4539
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Audit dashboard dependencies
        working-directory: dashboard
        run: npm audit --audit-level=moderate

  secrets-scan:
    name: Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Detect hardcoded secrets
        uses: gitleaks/gitleaks-action@bf2dc8e55639c1e091e9b45970152e4313705814 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
